[workspace]
resolver = "2"
members = [
    "crates/coop-attestation",
    "crates/coop-types",
    "crates/coop-store",
    "crates/coop-exec",
    "crates/coop-server",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/sambai-dev/rookhold"

[workspace.dependencies]
coop-types = { path = "crates/coop-types", version = "0.8.0" }
coop-store = { path = "crates/coop-store", version = "0.8.0" }
coop-exec = { path = "crates/coop-exec", version = "0.8.0" }
coop-attestation = { path = "crates/coop-attestation", version = "0.8.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras"] }
uuid = { version = "1", features = ["v7"] }
futures-util = "0.3"
dashmap = "6"
sha2 = "0.10"
base64 = "0.22.1"
clap = { version = "4.5.48", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
pkcs8 = { version = "0.11.0", features = ["pem"] }
thiserror = "2"
zeroize = "1.8"
rustix = { version = "1.1", features = ["process"] }
libc = "0.2"
hmac = "0.12"
subtle = "2"
aws-lc-rs = { version = "1.18.0", default-features = false }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
