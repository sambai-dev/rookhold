version: 2
# Version-update PRs are paused: pinned crypto deps (jsonwebtoken, aws-lc-rs)
# and the Tier/evidence description gate make bot PRs fail by default, so
# updates are done deliberately by a maintainer. Security updates still open
# regardless of the limit below, and the CI RustSec scan covers advisories.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      rust-patch-and-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /sdks/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
