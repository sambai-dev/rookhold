<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rookhold bounded execution recording</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      background: #050608;
      color: #f5f5f5;
    }
    * { box-sizing: border-box; }
    html, body { width: 960px; height: 540px; margin: 0; overflow: hidden; }
    body { background: #050608; }
    .stage { position: relative; width: 960px; height: 540px; padding: 25px 30px; }
    .rail { position: absolute; inset: 25px auto 24px 13px; width: 1px; background: #252b38; }
    .meta { display: flex; justify-content: space-between; color: #7d8797; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .meta strong { color: #79a0ff; }
    .hero { display: grid; grid-template-columns: 128px 1fr; gap: 22px; align-items: center; height: 151px; }
    .rook { margin: 0; color: #79a0ff; font-size: 15px; font-weight: 700; line-height: .92; letter-spacing: -1px; white-space: pre; }
    h1 { margin: 0 0 7px; font-size: 22px; letter-spacing: -.03em; }
    .sub { margin: 0; color: #9aa3b3; font-size: 14px; }
    .facts { display: grid; grid-template-columns: 82px 1fr; gap: 3px 12px; margin-top: 13px; font-size: 12px; color: #c1c7d0; }
    .facts dt { color: #6f7888; }
    .facts dd { margin: 0; }
    .warning { color: #f4bd6a; }
    .terminal { position: absolute; left: 30px; right: 30px; bottom: 25px; height: 325px; border: 1px solid #252b38; border-radius: 6px; background: #090b10; overflow: hidden; }
    .bar { display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 13px; border-bottom: 1px solid #1c2230; color: #7d8797; font-size: 11px; }
    .ready { color: #5dd39e; }
    .screen { padding: 12px 17px; font-size: 13px; line-height: 1.45; }
    .line { min-height: 19px; white-space: pre; }
    .prompt { color: #79a0ff; }
    .strong { color: #f5f5f5; font-weight: 600; }
    .muted { color: #8e96a6; }
    .accent { color: #79a0ff; }
    .success { color: #5dd39e; }
    .indent { padding-left: 18px; }
    .cursor { display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; background: #f5f5f5; }
    .spacer { height: 5px; }
    @media (prefers-reduced-motion: reduce) { .cursor { opacity: 1 !important; } }
  </style>
</head>
<body>
  <main class="stage" aria-label="Recording of Rookhold terminating a bounded infinite loop and saving its receipt">
    <div class="rail" aria-hidden="true"></div>
    <div class="meta"><strong>Rookhold / bounded run</strong><span>gVisor service · v0.8.0</span></div>
    <section class="hero">
      <pre class="rook" aria-hidden="true">    ██  ██
  ██████████
  ██████████
    ██████
    ██████
  ██████████</pre>
      <div>
        <h1>Rookhold CLI v0.8.0</h1>
        <p class="sub">Short jobs. Hard limits. Receipts.</p>
        <dl class="facts">
          <dt>Endpoint</dt><dd>https://executor.internal</dd>
          <dt>Tenant</dt><dd>demo</dd>
          <dt>Runtime</dt><dd>gVisor application kernel</dd>
          <dt>Network</dt><dd>blocked</dd>
        </dl>
      </div>
    </section>
    <section class="terminal">
      <div class="bar"><span>rookhold-cli</span><span class="ready">● connected</span></div>
      <div class="screen">
        <div class="line"><span class="prompt">$ </span><span class="strong" id="runCommand"></span><span class="cursor" id="cursor"></span></div>
        <div class="spacer"></div>
        <div class="line warning" id="terminated"></div>
        <div class="spacer"></div>
        <div class="line" id="status"></div>
        <div class="line" id="duration"></div>
        <div class="line" id="wall"></div>
        <div class="line" id="network"></div>
        <div class="line" id="isolation"></div>
        <div class="line success" id="receipt"></div>
      </div>
    </section>
  </main>
  <script>
    const queryTime = new URLSearchParams(location.search).get("t");
    const duration = 8.5;
    const byId = (id) => document.getElementById(id);
    const reveal = (text, start, end, time) => {
      if (time <= start) return "";
      if (time >= end) return text;
      return text.slice(0, Math.floor(text.length * (time - start) / (end - start)));
    };
    function render(time) {
      const t = Math.max(0, Math.min(duration, time));
      const command = "rookhold run python 'while True: pass' --wall-seconds 2";
      byId("runCommand").textContent = reveal(command, .35, 2.55, t);
      byId("terminated").textContent = t >= 4.8 ? "Job terminated after 2.00s" : "";
      byId("status").textContent = t >= 5.2 ? "status       timed_out" : "";
      byId("duration").textContent = t >= 5.55 ? "duration     2000ms" : "";
      byId("wall").textContent = t >= 5.9 ? "wall limit   2s — enforced" : "";
      byId("network").textContent = t >= 6.25 ? "network      disabled" : "";
      byId("isolation").textContent = t >= 6.6 ? "isolation    gvisor-application-kernel" : "";
      byId("receipt").textContent = t >= 7.05 ? "receipt      saved to .rookhold/runs/019…/receipt.json" : "";
      byId("cursor").style.opacity = t < 2.8 && Math.floor(t * 4) % 2 === 0 ? "1" : "0";
      window.__ready = true;
    }
    if (queryTime !== null) render(Number(queryTime));
    else if (matchMedia("(prefers-reduced-motion: reduce)").matches) render(duration);
    else {
      const started = performance.now();
      (function loop(now) {
        render(((now - started) / 1000) % duration);
        requestAnimationFrame(loop);
      })(started);
    }
  </script>
</body>
</html>
